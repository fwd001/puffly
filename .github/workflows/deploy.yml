name: Deploy

# Every push to main that passes the build goes live on GitHub Pages. There is no release
# step to remember: the game is a static, offline-first app (§53), so "built" and "shipped"
# are the same event.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Types and tests
        run: |
          npm run typecheck
          npm test

      - name: Build for the project-pages subpath
        id: build
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build
          echo "base=$PUBLIC_BASE" >> "$GITHUB_OUTPUT"

      - name: Check it is servable from that subpath
        env:
          PUBLIC_BASE: ${{ steps.build.outputs.base }}
        run: bash tests/smoke/served-build.sh

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
